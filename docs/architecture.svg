<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Jev-Sim: state, decision, possible futures, analysis</title>
  <desc id="desc">A provider-independent simulation engine branches probabilistic decisions into alternative futures and records the outcomes.</desc>
  <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dce2ea"/></pattern><linearGradient id="fade"><stop stop-color="#fcfdff"/><stop offset="1" stop-color="#faf7f3"/></linearGradient></defs>
  <rect width="1100" height="360" rx="16" fill="url(#fade)"/><rect width="1100" height="360" rx="16" fill="url(#dots)"/>
  <g font-family="system-ui, sans-serif"><text x="38" y="43" fill="#28303b" font-weight="650" font-size="21">jev<tspan fill="#eb753e">-</tspan>sim</text><text x="1060" y="40" text-anchor="end" fill="#96a1af" font-size="10" letter-spacing="2">THE FUTURE IS A DISTRIBUTION</text></g>
  <g fill="none" stroke="#c9d3df" stroke-width="1.5"><path d="M221 189H295"/><path d="M482 189C537 189 516 117 566 117"/><path d="M482 189H566"/><path d="M482 189C537 189 516 261 566 261"/><path d="M728 117C782 117 770 189 820 189M728 189H820M728 261C782 261 770 189 820 189"/></g>
  <path d="M482 189C537 189 516 117 566 117" fill="none" stroke="#ec996f" stroke-width="2"/>
  <g font-family="system-ui,sans-serif">
    <rect x="40" y="125" width="182" height="128" rx="9" fill="white" stroke="#e3e8ef"/><text x="59" y="149" fill="#96a1af" font-size="9" letter-spacing="1.5">ENVIRONMENT</text><text x="59" y="177" fill="#4f5d6f" font-size="15" font-weight="600">Current state</text><g fill="#919dad" font-family="monospace" font-size="11"><text x="59" y="201">battery: 31%</text><text x="59" y="222">obstacle: true</text><text x="59" y="241">payload: fragile</text></g>
    <rect x="295" y="138" width="187" height="102" rx="9" fill="#fff8f3" stroke="#ecb492"/><text x="315" y="164" fill="#ce845e" font-size="9" letter-spacing="1.5">DECISION POLICY</text><text x="315" y="194" fill="#765b4d" font-size="16" font-weight="600">A typed distribution</text><text x="315" y="219" fill="#a98f7e" font-size="10">Jev · HTTP · local · Python</text>
    <g fill="white" stroke="#e1e7ef"><rect x="566" y="92" width="162" height="50" rx="7"/><rect x="566" y="164" width="162" height="50" rx="7"/><rect x="566" y="236" width="162" height="50" rx="7"/></g><g fill="#65768a" font-family="monospace" font-size="11"><text x="585" y="122">REROUTE</text><text x="706" y="122" text-anchor="end" fill="#d58a60">62%</text><text x="585" y="194">RETURN</text><text x="706" y="194" text-anchor="end">25%</text><text x="585" y="266">OTHER</text><text x="706" y="266" text-anchor="end">13%</text></g>
    <rect x="820" y="120" width="240" height="139" rx="9" fill="white" stroke="#e2e8ef"/><text x="840" y="148" fill="#91a09f" font-size="9" letter-spacing="1.5">EXPLORE THE OUTCOMES</text><text x="840" y="177" fill="#4c605b" font-size="15" font-weight="600">Understand before acting.</text><text x="840" y="200" fill="#8f9ca8" font-size="11">Replay · Monte Carlo · Branching</text><text x="840" y="221" fill="#8f9ca8" font-size="11">Failure hunting · Counterfactuals</text><rect x="840" y="237" width="127" height="4" rx="2" fill="#91bca5"/><rect x="971" y="237" width="36" height="4" rx="2" fill="#a2b9d4"/><rect x="1011" y="237" width="27" height="4" rx="2" fill="#d9a19b"/>
    <text x="40" y="332" fill="#99a5b2" font-size="10">Simulate thousands of futures before your AI makes a decision.</text><text x="1060" y="332" text-anchor="end" fill="#a1abb8" font-size="9">Illustrative probabilities · no runtime dependencies</text>
